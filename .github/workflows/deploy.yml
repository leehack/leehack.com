name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14'
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - name: Refresh live data
        run: dart run tool/refresh.dart
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          export SITE_BASE="${PAGES_BASE_PATH%/}/"
          dart run jaspr_cli:jaspr build
          dart run tool/not_found.dart
      - run: dart run tool/shortlinks.dart
      - name: Stage semantic search
        run: bash prototypes/flight-mode/build.sh build/jaspr
      - name: Drop build tooling the page never loads
        run: rm -rf build/jaspr/packages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/jaspr

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
