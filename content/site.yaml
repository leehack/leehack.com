# Everything on leehack.com that a person edits lives in this file.
# Numbers and the post list come from content/live.json, which `dart run tool/refresh.dart` rewrites.

profile:
  name: Jhin Lee
  domain: leehack.com
  # A tag is plain text, or {label, url} to link it.
  tags:
    - {label: Flutter & Dart GDE, url: "https://developers.google.com/community/experts"}
    - {label: Codex Ambassador, url: "https://developers.openai.com/community/codex-ambassadors/directory?ambassador=jhin-lee"}
    - Senior dev @ Unity
    - Montréal
  question: who is Jhin?
  # Text between *asterisks* is shown in the accent colour.
  intro: I build open-source tools for using AI from Dart and Flutter. Most of it runs *on the device*, with no cloud involved.
  footer_note: These answers are pre-written. No model is running here.
  # One line under the name. {downloads} is the live monthly pub.dev total.
  facts:
    - {value: "{downloads}", label: pub.dev downloads a month}
    - {value: "30+", label: talks and workshops since 2023}
    - {value: "3", label: FlutterCon talks}
    - {value: "2", label: books translated into Korean}

seo:
  title: Jhin Lee · Flutter & Dart GDE
  description: Flutter & Dart GDE in Montréal. Author of mcp_dart and llamadart. Open-source tools that run AI on-device in Dart and Flutter apps.

analytics:
  # GA4 measurement ID, like G-XXXXXXXXXX. Leave empty to ship without analytics or the consent banner.
  ga_measurement_id: "G-HHREBR2KLK"

sources:
  devto_user: leehack
  posts_shown: 4

links:
  github: {label: GitHub, handle: "@leehack", url: "https://github.com/leehack"}
  linkedin: {label: LinkedIn, handle: in/leehack, url: "https://linkedin.com/in/leehack"}
  x: {label: X, handle: "@leehack", url: "https://x.com/leehack"}
  bluesky: {label: Bluesky, handle: leehack.com, url: "https://bsky.app/profile/leehack.com"}
  blog: {label: Blog, handle: dev.to, url: "https://dev.to/leehack"}
  talks: {label: Talks, handle: sessionize, url: "https://sessionize.com/leehack"}
  fluttermtl: {label: Flutter Montréal, handle: organizer, url: "https://fluttermtl.dev/"}
  gdg: {label: GDG Montréal, handle: organizer, url: "https://gdg.community.dev/gdg-montreal/"}
  gdev: {label: Google Developer Profile, handle: g.dev, url: "https://g.dev/leehack"}
  coffee: {label: Buy me a coffee, handle: thanks, url: "https://buymeacoffee.com/leehack"}

# Keys from `links`, shown in the top bar.
nav: [github, linkedin, x, bluesky]

# One entry per chip. `type` picks the layout: packages | list | posts | links.
answers:
  - id: build
    chip: What do you build?
    lead: "Three Dart packages take most of my time:"
    type: packages
    packages:
      - name: mcp_dart
        pub: mcp_dart
        url: "https://pub.dev/packages/mcp_dart"
        blurb: The Model Context Protocol SDK for Dart.
      - name: llamadart
        pub: llamadart
        url: "https://llamadart.leehack.com"
        blurb: On-device LLM inference for Dart & Flutter, on six platforms.
      - name: dinja
        pub: dinja
        url: "https://pub.dev/packages/dinja"
        blurb: A Jinja engine for LLM chat templates.
    extras_label: More
    extras:
      - {label: QuAI, url: "https://quai.leehack.com"}
      - {label: Llama Village, url: "https://github.com/leehack/llama-village"}
      - {label: Flutter Kart GP, url: "https://github.com/leehack/flutter-kart-gp"}
      - {label: All my packages on pub.dev, url: "https://pub.dev/publishers/leehack.com/packages"}

  - id: speak
    chip: Where do you speak?
    lead: "About 30 talks and workshops since 2023, at meetups, DevFests and FlutterCon. Some that were recorded:"
    type: list
    items:
      - tag: "2026"
